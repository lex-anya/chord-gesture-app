  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg:         #000000;
        --panel-bg:   #000000;
        --accent:     #7C3AED;
        --highlight:  #A78BFA;
        --text:       #F5F5F5;
        --muted:      #6B7280;
        --border:     #1F1F1F;
        --success:    #10B981;
        --warning:    #F59E0B;
    }

    html, body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        max-height: 100vh; 
    }

    body {
        background: #000000;
        margin: 0;
    }

    /* ── App shell ── */
    #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        z-index: 1;
        background: transparent;
    }

    /* ── Camera section (top 60%) ── */
    #camera-section {
        position: relative;
        flex: 0 0 58vh;
        background: #000000;
        overflow: hidden;
    }

    #video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: scaleX(-1); /* mirror so it feels natural */ 
    }

    #canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
    }

    #camera-section {
        position: relative;
        flex: 0 0 72vh;
        background: #000000;
        overflow: hidden;
        z-index: 2;
    }

    #controls-section {
        flex: 1;
        background: transparent;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 8px 16px;
        gap: 10px;
        overflow: hidden;
        z-index: 2;
        position: relative;
        text-align: center;
    }

    /* ── Controls section (bottom 40%) ── */
    #controls-section {
        flex: 1;
        background: var(--panel-bg);
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 12px 16px;
        gap: 10px;
        overflow: hidden;
    }

    /* ── Now playing row ── */
    #now-playing {
        display: flex;
        align-items: center;
        gap: 24px;
    }

    .playing-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    #chord-display {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 600;
        color: var(--highlight);
        min-width: 80px;
        transition: text-shadow 0.2s ease;
    }

    #chord-display.playing {
        text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
    }

    /* #volume-display {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: var(--muted);
    } */

    #chord-slots {
        display: flex;
        flex-direction: column;
        padding: 8px 0;
        gap: 8px;
        width: 100%;
    }

.slots-row {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 8px;
  width: 100%;
}

.slot-cell {
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.slot-root-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  padding: 5px 4px;
  text-align: center;
  pointer-events: none;
  cursor: default;
}

.slot-root-input.active {
  border-color: var(--accent);
}

.slot-root-input.playing {
  border-color: var(--highlight);
}

.slot-select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  text-align: center;
  text-align-last: center;
  padding: 5px 2px;
  pointer-events: none;
  appearance: none;
  -webkit-appearance: none;
}

.slot-select.active {
  border-color: var(--accent);
}

.slot-select.playing {
  border-color: var(--highlight);
}

.slot-gesture-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  color: var(--muted);
  text-align: center;
  padding-top: 4px;
}

    /* ── Status indicator ── */
    #status {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
    }

    #status.ready { color: var(--success); }
    #status.error { color: var(--warning); }

    #gesture-tooltip {
        position: fixed;
        background: var(--panel-bg);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease;
        z-index: 100;
    }

    #gesture-tooltip.visible {
        opacity: 1;
    }

    #gesture-img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 6px;
    }

  </style>

<script>
  const tooltip = document.getElementById("gesture-tooltip");
  const tooltipImg = document.getElementById("gesture-img");

  document.addEventListener("mouseover", e => {
    const label = e.target.closest(".slot-gesture-label");
    if (!label) return;

    // Get slot index from text content (1-10)
    const num = parseInt(label.textContent.trim());
    if (isNaN(num)) return;

    tooltipImg.src = `assets/gestures/gesture_${num}.jpg`;
    tooltip.classList.add("visible");

    const rect = label.getBoundingClientRect();
    tooltip.style.left = `${rect.left + rect.width / 2 - 40}px`;
    tooltip.style.top  = `${rect.top - 90}px`;
  });

  document.addEventListener("mouseout", e => {
    if (e.target.closest(".slot-gesture-label")) {
      tooltip.classList.remove("visible");
    }
  });
</script>
